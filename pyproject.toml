[project]
name = "termboard"
version = "1.0.0"
description = "A beautiful terminal UI dashboard for managing Python projects, virtual environments, and tasks."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Shinde Aditya", email = "aditya@shindeaditya.com" }
]
keywords = ["terminal", "tui", "dashboard", "textual", "task-runner", "virtual-environment", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://heyshinde.github.io/TermBoard/"
Documentation = "https://heyshinde.github.io/TermBoard/"
Repository = "https://github.com/HeyShinde/TermBoard"
Issues = "https://github.com/HeyShinde/TermBoard/issues"

[project.scripts]
termboard = "termboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termboard"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pre-commit>=4.6.1",
]


