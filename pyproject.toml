[project]
name = "termboard"
version = "0.1.0"
description = "A beautiful terminal UI dashboard for managing Python projects, virtual environments, and tasks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
termboard = "termboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termboard"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]


