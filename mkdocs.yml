site_name: TermBoard
site_url: https://heyshinde.github.io/TermBoard/
site_description: A beautiful, interactive terminal dashboard for Python projects, environments, and tasks.
repo_name: HeyShinde/TermBoard
repo_url: https://github.com/HeyShinde/TermBoard
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: astral-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: astral-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - header.autohide
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Features: features.md
  - Installation: installation.md
  - Configuration: configuration.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
